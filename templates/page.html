<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <title>__TITLE__</title>
  <style>
    :root{--paper:#f7f5ef;--card:#fff;--ink:#17242d;--muted:#596b75;--line:#dce3df;--accent:#3159c5;--accent2:#e85d45;--soft:#eef3f7;--mint:#ddf2e7;--radius:18px;--shadow:0 16px 48px rgba(28,48,58,.07)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button{cursor:pointer}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.lesson{width:min(100% - 36px,920px);margin:auto;padding:64px 0 90px}.lesson-header{padding-bottom:42px;border-bottom:1px solid var(--line)}h1{max-width:820px;margin:0 0 12px;font:700 clamp(2.5rem,7vw,5.8rem)/.98 Georgia,serif;letter-spacing:-.045em}.source-line{margin:0;color:var(--muted);font-size:.9rem}.source-line a{color:var(--accent);text-underline-offset:3px}.opening{display:grid;grid-template-columns:1fr 1fr;gap:42px;padding:54px 0}.opening h2,.equation-section h2,.recap h2,.sources h2{font:650 clamp(1.55rem,3vw,2.25rem)/1.15 Georgia,serif;margin:0 0 15px}.opening p{margin:.5em 0}.equation-section{padding:32px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow)}.equation{overflow:auto;padding:20px;margin:16px 0;background:#f1f4ff;border-radius:12px;color:#203c91;font:650 clamp(.95rem,2vw,1.3rem)/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}.symbols{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}.symbol{padding:10px 12px;border-top:1px solid var(--line);font-size:.88rem}.symbol b{color:var(--accent);font-family:ui-monospace,monospace}.steps{counter-reset:lesson-step;margin-top:70px}.lesson-step{counter-increment:lesson-step;padding:54px 0;border-top:1px solid var(--line)}.step-kicker{color:var(--accent);font:750 .72rem/1 ui-monospace,monospace;text-transform:uppercase;letter-spacing:.13em}.step-kicker::after{content:" " counter(lesson-step)}.lesson-step h2{max-width:760px;margin:12px 0 18px;font:650 clamp(1.8rem,4vw,3rem)/1.08 Georgia,serif;letter-spacing:-.02em}.step-copy{max-width:720px;font-size:1.04rem}.step-copy p{margin:.7em 0}.activity{margin:28px 0 18px;padding:22px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}.activity-grid{display:grid;grid-template-columns:minmax(190px,.55fr) minmax(0,1.45fr);gap:22px}.controls:empty{display:none}.activity-grid:has(.controls:empty){grid-template-columns:1fr}.control{padding:10px 0;border-bottom:1px solid var(--line)}.control:last-child{border:0}.control label{display:flex;justify-content:space-between;gap:10px;font-size:.8rem;font-weight:750}.control small{display:block;color:var(--muted);font-size:.7rem}.control input:not([type=checkbox]),.control select{width:100%;accent-color:var(--accent)}.control-value{color:var(--accent);font-family:ui-monospace,monospace}.editor-grid{display:grid;gap:5px;margin-top:8px}.editor-grid input{min-width:0;padding:7px;border:1px solid var(--line);border-radius:7px}.distribution-row{display:grid;grid-template-columns:1fr 48px;gap:7px;align-items:center}.figures{display:grid;gap:16px}.figure{min-width:0;padding:16px;border-radius:14px;background:var(--soft);border:1px solid #dde5ec}.figure h3{margin:0 0 10px;font-size:.95rem}.figure svg{display:block;width:100%;height:auto;max-height:420px}.caption{margin:9px 0 0;color:var(--muted);font-size:.76rem}.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.readout{padding:12px;background:#fff;border:1px solid var(--line);border-radius:10px}.readout b{display:block;color:var(--accent);font:700 1.05rem ui-monospace,monospace}.live-equation{padding:17px;background:#fff;border-radius:10px;font-family:ui-monospace,monospace;overflow:auto}.flow{display:flex;align-items:center;gap:7px;overflow:auto;padding:18px 4px}.flow-node{min-width:105px;padding:13px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:11px}.flow-node b{display:block;color:var(--accent);font-family:ui-monospace,monospace}.arrow{color:var(--muted);white-space:nowrap}.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}.compare-side{padding:12px;background:#fff;border-radius:11px}.compare-side h4{margin:0 0 7px}.walk-controls{display:flex;justify-content:space-between;align-items:center;gap:10px}.walk-controls button,.guide button{border:0;border-radius:9px;background:var(--accent);color:#fff;padding:9px 14px;font-weight:750}.guide{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:14px;align-items:center;margin-top:16px;padding:17px;border-radius:14px;background:var(--mint);border:1px solid #bedfce}.guide strong{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}.takeaway{margin:18px 0 0;padding-left:15px;border-left:4px solid var(--accent2);font-weight:700}.paper-figure{margin:20px 0;padding:12px;border:1px solid var(--line);border-radius:12px}.paper-figure img{max-width:100%;border-radius:8px}.paper-figure figcaption{font-size:.78rem;color:var(--muted)}.recap,.sources{margin-top:60px;padding-top:45px;border-top:1px solid var(--line)}.recap ul{padding:0;list-style:none}.recap li{margin:8px 0;padding:12px 15px;background:var(--card);border-radius:10px}.recap li::before{content:"✓";color:#188055;font-weight:900;margin-right:10px}.paper-card{padding:24px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}.paper-card h3{margin:0 0 8px}.metadata{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:18px 0}.metadata div{font-size:.82rem}.metadata b{display:block;color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.07em}.links{display:flex;flex-wrap:wrap;gap:8px}.links a{padding:6px 10px;border-radius:8px;background:var(--soft);color:var(--accent)}.claims{margin-top:22px}.claim{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.badge{height:max-content;padding:4px 8px;border-radius:999px;background:#edf1ff;color:#2949a7;font-size:.68rem;font-weight:750}.limitation{margin-top:20px;padding:18px;background:#fff0eb;border-left:5px solid var(--accent2);border-radius:10px}.references{font-size:.8rem;color:var(--muted)}.runtime-error{display:none;padding:12px;background:#ffe0db;color:#8b281d;border-radius:9px}.flash{animation:flash 1s}@keyframes flash{50%{outline:6px solid rgba(49,89,197,.25)}}
    @media(max-width:720px){.lesson{padding-top:38px}.opening,.activity-grid,.guide{grid-template-columns:1fr}.compare{grid-template-columns:1fr}.guide button{width:100%}}
  </style>
</head>
<body><main class="lesson">
  <header class="lesson-header"><h1 id="concept-title"></h1><p id="source-line" class="source-line"></p></header>
  <section class="opening"><div><h2>What it is</h2><div id="what-it-is"></div></div><div><h2>Why it exists</h2><div id="why-it-exists"></div></div></section>
  <section class="equation-section"><h2>The equation</h2><div id="equation" class="equation"></div><div id="symbols" class="symbols"></div></section>
  <section id="steps" class="steps" aria-label="Lesson steps"></section>
  <section class="recap"><h2>Recap</h2><ul id="recap"></ul></section>
  <section class="sources"><h2>Sources &amp; simplifications</h2><div id="sources"></div></section>
</main>
<script>
(()=>{'use strict';
const SPEC=__SPEC__,PAPER=__PAPER__,EXTRA=__EXTRA__,compute=(__COMPUTE__),draw=(__DRAW__);
const state={},controlNodes={},stepRenders=[],$=s=>document.querySelector(s),make=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!==undefined)n.textContent=x;return n},clone=x=>JSON.parse(JSON.stringify(x));
const at=(o,p)=>String(p||'').split('.').reduce((v,k)=>v&&v[k],o),fmt=(v,n=3)=>typeof v==='number'?(Number.isFinite(v)?Number(v.toFixed(n)).toString():'—'):Array.isArray(v)?v.map(x=>fmt(x,n)).join(', '):String(v??'—');
for(const step of SPEC.steps)for(const c of step.controls)state[c.id]=clone(c.default);
let result={};
function paraList(target,items){for(const text of items||[])target.append(make('p','',text))}
$('#concept-title').textContent=SPEC.concept.title;paraList($('#what-it-is'),SPEC.concept.what_it_is);paraList($('#why-it-exists'),SPEC.concept.why_it_exists);$('#equation').textContent=SPEC.concept.equation;
for(const s of SPEC.concept.symbols||[]){const n=make('div','symbol');n.append(make('b','',s.symbol+' '),document.createTextNode(s.meaning));$('#symbols').append(n)}
const first=PAPER.authors[0]?.name||'Source', author=PAPER.authors.length>1?first+' et al.':first, bits=[author,PAPER.year||SPEC.citation.year,SPEC.citation.section?'§'+SPEC.citation.section:'',SPEC.citation.equation?'Eq. ('+SPEC.citation.equation+')':''].filter(Boolean);const sourceLink=make('a','',bits.join(' · '));sourceLink.href=PAPER.urls.section||PAPER.urls.source||'#sources';$('#source-line').append('From ',sourceLink);
function editor(control,onchange){const kind=control.type;if(kind==='select'){const el=make('select');for(const raw of control.options||[]){const o=make('option','',typeof raw==='object'?raw.label:raw);o.value=typeof raw==='object'?raw.value:raw;el.append(o)}el.value=control.default;el.apply=v=>{el.value=v};el.onchange=()=>onchange(el.value);return el}if(kind==='toggle'){const el=make('input');el.type='checkbox';el.checked=!!control.default;el.apply=v=>{el.checked=!!v};el.onchange=()=>onchange(el.checked);return el}if(kind==='matrix_editor'){const grid=make('div','editor-grid'),rows=control.rows||control.default.length,cols=control.cols||(control.default[0]||[]).length;grid.style.gridTemplateColumns=`repeat(${cols},minmax(42px,1fr))`;const cells=[];for(let i=0;i<rows;i++)for(let j=0;j<cols;j++){const el=make('input');el.type='number';el.step='any';el.value=control.default?.[i]?.[j]??0;cells.push(el);el.oninput=()=>{const value=Array.from({length:rows},(_,r)=>Array.from({length:cols},(_,c)=>Number(cells[r*cols+c].value)||0));onchange(value)}}grid.apply=value=>cells.forEach((el,i)=>{el.value=value?.[Math.floor(i/cols)]?.[i%cols]??0});return grid}if(kind==='vector_editor'||kind==='distribution_editor'){const box=make('div','editor-grid'),values=control.default||[],outputs=[];box.style.gridTemplateColumns='1fr';const inputs=[];const normalize=value=>{let next=(value||[]).map(x=>kind==='distribution_editor'?Math.max(0,Number(x)||0):(Number(x)||0));if(kind==='distribution_editor'){const sum=next.reduce((a,b)=>a+b,0);next=sum?next.map(x=>x/sum):next}return next};values.forEach((value,i)=>{const row=make('div',kind==='distribution_editor'?'distribution-row':'control'),el=make('input'),out=make('span','control-value',fmt(value));el.type=kind==='distribution_editor'?'range':'number';el.min=kind==='distribution_editor'?0:'';el.max=kind==='distribution_editor'?1:'';el.step=kind==='distribution_editor'?0.01:'any';el.value=value;inputs.push(el);outputs.push(out);el.oninput=()=>{const next=normalize(inputs.map(x=>x.value));next.forEach((x,k)=>{inputs[k].value=x;outputs[k].textContent=fmt(x)});onchange(next)};row.append(el,out);box.append(row)});box.apply=value=>normalize(value).forEach((x,i)=>{inputs[i].value=x;outputs[i].textContent=fmt(x)});return box}const el=make('input');el.type=kind==='slider'?'range':'number';for(const k of ['min','max','step'])if(control[k]!==undefined)el[k]=control[k];el.value=control.default;el.apply=v=>{el.value=v};el.oninput=()=>onchange(Number(el.value));return el}
function controlUI(control){const row=make('div','control'),label=make('label','',control.label),value=make('span','control-value',fmt(control.default));label.append(value);let input,record;const set=(v,refresh=true)=>{if(control.type==='distribution_editor'){const raw=(v||[]).map(x=>Math.max(0,Number(x)||0)),sum=raw.reduce((a,b)=>a+b,0);v=sum?raw.map(x=>x/sum):raw}state[control.id]=clone(v);for(const node of controlNodes[control.id]||[])node.apply(v);if(refresh)update()};input=editor(control,set);record={set,apply:v=>{value.textContent=fmt(v);if(input?.apply)input.apply(v)},input};(controlNodes[control.id]??=[]).push(record);row.append(label,input,make('small','',control.help||''));return row}
function svgBase(){const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 680 340');return[ns,svg]}
function nums(value){if(Array.isArray(value))return value.flat(Infinity).map(Number).filter(Number.isFinite);if(value&&typeof value==='object')return Object.values(value).flat(Infinity).map(Number).filter(Number.isFinite);return Number.isFinite(value)?[value]:[]}
function bar(value){const[ns,svg]=svgBase(),a=nums(value),max=Math.max(1,...a.map(Math.abs));a.forEach((v,i)=>{const w=560/Math.max(1,a.length),h=230*Math.abs(v)/max,r=document.createElementNS(ns,'rect'),t=document.createElementNS(ns,'text');for(const[k,x]of Object.entries({x:60+i*w,y:275-h,width:Math.max(7,w-9),height:h,rx:5,fill:'#3159c5'}))r.setAttribute(k,x);t.setAttribute('x',63+i*w);t.setAttribute('y',303);t.textContent=fmt(v,2);svg.append(r,t)});return svg}
function line(value,marker){const[ns,svg]=svgBase(),a=nums(value),lo=Math.min(0,...a),hi=Math.max(1,...a),span=hi-lo||1,point=(v,i)=>[60+i*560/Math.max(1,a.length-1),275-(v-lo)*225/span],poly=document.createElementNS(ns,'polyline');poly.setAttribute('points',a.map((v,i)=>point(v,i).join(',')).join(' '));poly.setAttribute('fill','none');poly.setAttribute('stroke','#3159c5');poly.setAttribute('stroke-width','5');svg.append(poly);if(Number.isFinite(marker)){const i=Math.max(0,Math.min(a.length-1,marker)),[x,y]=point(a[i],i),c=document.createElementNS(ns,'circle');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',9);c.setAttribute('fill','#e85d45');svg.append(c)}return svg}
function heatmap(value){const[ns,svg]=svgBase(),m=Array.isArray(value)&&Array.isArray(value[0])?value:[nums(value)],rows=m.length,cols=Math.max(1,...m.map(x=>x.length)),max=Math.max(1,...m.flat().map(x=>Math.abs(Number(x)||0)));m.forEach((row,i)=>row.forEach((v,j)=>{const rect=document.createElementNS(ns,'rect'),text=document.createElementNS(ns,'text');for(const[k,x]of Object.entries({x:65+j*560/cols,y:25+i*275/rows,width:550/cols,height:265/rows,fill:`hsl(224 62% ${95-58*Math.abs(v)/max}%)`}))rect.setAttribute(k,x);text.setAttribute('x',75+j*560/cols);text.setAttribute('y',52+i*275/rows);text.textContent=fmt(v,2);svg.append(rect,text)}));return svg}
function table(value){const t=make('table','');t.style.width='100%';const rows=Array.isArray(value)?value:Object.entries(value||{});for(const row of rows){const tr=make('tr');for(const cell of(Array.isArray(row)?row:[row])){const td=make('td','',fmt(cell));td.style.padding='7px';td.style.borderBottom='1px solid #dce3df';tr.append(td)}t.append(tr)}return t}
function basicView(type,value,component){if(type==='line')return line(value,Number(at(result,component.marker_bind)));if(type==='heatmap')return heatmap(value);if(type==='table')return table(value);if(type==='vector_view'){const b=make('div','readouts');nums(value).forEach((v,i)=>{const n=make('div','readout');n.append(make('b','',fmt(v)),document.createTextNode('component '+(i+1)));b.append(n)});return b}if(type==='value_readout'){const b=make('div','readouts');if(value&&typeof value==='object'&&!Array.isArray(value))for(const[k,v]of Object.entries(value)){const n=make('div','readout');n.append(make('b','',fmt(v)),document.createTextNode(k));b.append(n)}else{const n=make('div','readout');n.append(make('b','',fmt(value)),document.createTextNode(component.title||'value'));b.append(n)}return b}return bar(value)}
function renderComponent(component,host){host.replaceChildren();const type=component.type;if(type==='equation_live'){const eq=make('div','live-equation',component.equation||'');for(const b of component.bindings||[])eq.append(make('div','',`${b.label}: ${fmt(at(result,b.bind))}`));host.append(eq)}else if(type==='flow_diagram'){const flow=make('div','flow');(component.nodes||[]).forEach((node,i)=>{if(i){const edge=(component.edges||[])[i-1]||{};flow.append(make('span','arrow',(edge.label?edge.label+' ':'')+'→'))}const n=make('div','flow-node',node.label);if(node.bind)n.append(make('b','',fmt(at(result,node.bind))));flow.append(n)});host.append(flow)}else if(type==='compare_ab'){const box=make('div','compare');for(const sideName of ['left','right']){const side=component[sideName],r=compute({...clone(state),...clone(side.preset||{})}),n=make('div','compare-side');n.append(make('h4','',side.label),basicView(component.view||'bar',at(r,side.bind),component));box.append(n)}host.append(box)}else if(type==='step_through'){const ops=component.operations||[];let index=0;const body=make('div'),nav=make('div','walk-controls'),prev=make('button','', 'Back'),next=make('button','', 'Next'),paint=()=>{const op=ops[index]||{};body.replaceChildren(make('h4','',op.label||''),basicView('value_readout',at(result,op.bind),op));nav.querySelector('span').textContent=`${index+1} / ${ops.length}`;prev.disabled=index===0;next.disabled=index>=ops.length-1};prev.onclick=()=>{index=Math.max(0,index-1);paint()};next.onclick=()=>{index=Math.min(ops.length-1,index+1);paint()};nav.append(prev,make('span'),next);host.append(body,nav);paint()}else if(type==='sweep_plot'){const points=[],count=Math.max(3,Math.min(40,component.points||15));for(let i=0;i<count;i++){const x=Number(component.min)+(Number(component.max)-Number(component.min))*i/(count-1),r=compute({...clone(state),[component.parameter]:x});points.push(Number(at(r,component.bind))||0)}host.append(line(points,Math.round((Number(state[component.parameter])-Number(component.min))/(Number(component.max)-Number(component.min))*(count-1))))}else if(type==='custom_svg'){host.innerHTML=draw(clone(state),clone(result))}else host.append(basicView(type,at(result,component.bind),component))}
function figureUI(component){const box=make('div','figure');if(component.title)box.append(make('h3','',component.title));const host=make('div');box.append(host);if(component.caption)box.append(make('p','caption',component.caption));stepRenders.push(()=>renderComponent(component,host));return box}
for(const step of SPEC.steps){const section=make('article','lesson-step');section.id='step-'+step.id;section.append(make('span','step-kicker','Step'));section.append(make('h2','',step.heading));const copy=make('div','step-copy');paraList(copy,step.explanation);section.append(copy);const activity=make('div','activity'),error=make('div','runtime-error'),grid=make('div','activity-grid'),controls=make('div','controls'),figures=make('div','figures');for(const c of step.controls)controls.append(controlUI(c));for(const c of step.components)figures.append(figureUI(c));grid.append(controls,figures);activity.append(error,grid);section.append(activity);for(const f of EXTRA.figures.filter(x=>x.step_id===step.id)){const fig=make('figure','paper-figure');if(f.data){const img=make('img');img.src=f.data;img.alt=f.caption;fig.append(img)}fig.append(make('figcaption','',`${f.caption} — ${f.role}`));section.append(fig)}const g=step.guide,guide=make('div','guide');for(const[label,text]of [['Try',g.try],['Notice',g.notice],['Why',g.why]]){const n=make('div');n.append(make('strong','',label),document.createTextNode(text));guide.append(n)}const button=make('button','', 'Try it');button.onclick=()=>{for(const[k,v]of Object.entries(g.preset||{})){const nodes=controlNodes[k];if(nodes?.length)nodes[0].set(v,false);else state[k]=clone(v)}update();activity.classList.add('flash');setTimeout(()=>activity.classList.remove('flash'),1000)};guide.append(button);section.append(guide,make('p','takeaway',step.takeaway));$('#steps').append(section)}
function update(){try{result=compute(clone(state));for(const paint of stepRenders)paint()}catch(error){for(const n of document.querySelectorAll('.runtime-error')){n.textContent='This teaching model could not update: '+error.message;n.style.display='block'}}}update();
for(const item of SPEC.recap)$('#recap').append(make('li','',item.text));
const sources=$('#sources'),card=make('div','paper-card');card.append(make('h3','',PAPER.title||SPEC.concept.title));const authorLine=make('p','',PAPER.authors.map(a=>a.name+(a.affiliations.length?' — '+a.affiliations.join('; '):'')).join(' · '));card.append(authorLine);const metadata=make('div','metadata');for(const[label,value]of [['arXiv',[PAPER.arxiv_id,PAPER.version].filter(Boolean).join(' ')],['Dates',PAPER.dates.join(' · ')],['Categories',PAPER.categories.join(', ')],['DOI / journal',[PAPER.doi,PAPER.journal_ref].filter(Boolean).join(' · ')],['License',PAPER.license]])if(value){const n=make('div');n.append(make('b','',label),document.createTextNode(value));metadata.append(n)}card.append(metadata);const links=make('div','links');for(const[label,url]of Object.entries(PAPER.urls))if(url){const a=make('a','',label);a.href=url;a.rel='noopener noreferrer';links.append(a)}card.append(links);sources.append(card);const claims=make('div','claims');for(const c of SPEC.claims){const row=make('div','claim'),label=c.source==='paper'?'📄 From paper'+(c.section?' §'+c.section:''):c.source==='brief'?'📝 From the brief':'🧪 Our simplification';row.append(make('span','badge',label),make('span','',c.text));claims.append(row)}sources.append(claims);const limitation=make('div','limitation');limitation.append(make('strong','', 'Limits of this lesson'),make('p','',SPEC.limitation.text),make('p','',SPEC.mechanism.toy_model_notice));sources.append(limitation);if(PAPER.references.length){const details=make('details','references'),list=make('ol');for(const r of PAPER.references)list.append(make('li','',r.text));details.append(make('summary','',`References cited in the selected section (${PAPER.references.length})`),list);sources.append(details)}
})();
</script></body></html>
