<style>

pe=editorial]{--display:Georgia,serif;--body:Georgia,serif}body[data-type=compact]{font-size:15px}main{max-width:1200px;margin:auto;padding:clamp(14px,4vw,48px)}h1,h2,h3{font-family:var(--display);line-height:1.08}h1{font-size:clamp(2.4rem,7vw,6.7rem);letter-spacing:-.055em;margin:.18em 0}h2{font-size:clamp(1.65rem,3.2vw,2.8rem);letter-spacing:-.025em;margin:.1em 0 .7em}h3{margin:.2em 0 .45em}p{max-width:72ch}.component{position:relative;margin:clamp(18px,4vw,54px) 0}.surface{background:color-mix(in srgb,var(--surface) 94%,transparent);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(20px,4vw,42px);box-shadow:var(--shadow);backdrop-filter:blur(14px)}.eyebrow,.badge{font:750 .75rem/1 var(--body);letter-spacing:.11em;text-transform:uppercase}.eyebrow{color:var(--accent)}.badge{display:inline-flex;border:1px solid currentColor;border-radius:999px;padding:.42rem .65rem}.muted,.help{color:var(--muted)}.hero{min-height:58vh;display:grid;align-items:end;border-bottom:1px solid var(--line);padding:7vh 0 5vh}.hero.split{grid-template-columns:1.5fr .7fr;gap:7vw}.hero.statement{text-align:center;place-items:center}.hero.statement p{margin-inline:auto}.hero.compact{min-height:auto;padding:4vh 0}.hero-copy{font-size:clamp(1.05rem,2vw,1.35rem);color:var(--muted)}.outcomes{counter-reset:item;display:grid;gap:10px}.outcome{display:grid;grid-template-columns:2rem 1fr;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}.outcome:before{counter-increment:item;content:counter(item,decimal-leading-zero);color:var(--accent);font-weight:800}.source-strip{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px}.source-strip.ribbon{border-block:1px solid var(--line);padding:18px 0}.source-strip.card{padding:20px;background:var(--surface2);border-radius:var(--radius)}a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:3px}.concept.equation_focus{display:grid;grid-template-columns:.8fr 1.2fr;gap:5vw;align-items:center}.concept.two_column{columns:2;column-gap:5vw}.equation{display:block;overflow:auto;padding:clamp(18px,4vw,34px);border:1px solid var(--line);border-radius:calc(var(--radius)*.7);background:var(--surface2);font:600 clamp(1rem,2.3vw,1.5rem)/1.5 ui-monospace,SFMono-Regular,monospace;color:var(--accent)}.symbol-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.symbol-chip{padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}.symbol-chip b{font:700 1.35rem ui-monospace,monospace;color:var(--accent)}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:.65rem;border-bottom:1px solid var(--line);vertical-align:top}.figure-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.figure-card{margin:0;padding:12px;border:1px solid var(--line);border-radius:16px}.figure-card img{max-width:100%;height:auto;border-radius:10px}.lab.dashboard .lab-grid{grid-template-columns:1fr}.lab.canvas .visual{min-height:520px}.lab-grid{display:grid;grid-template-columns:minmax(230px,.7fr) minmax(0,1.7fr);gap:20px}.controls{padding:2px}.control-row{border-bottom:1px solid var(--line);padding:12px 0}.controls label{display:block;font-weight:750;margin-bottom:5px}.controls input:not([type=checkbox]),.controls select,.controls textarea{width:100%;accent-color:var(--accent)}.value{color:var(--accent);font-variant-numeric:tabular-nums}.help{font-size:.82rem}.visual{min-height:360px;border:1px solid var(--line);border-radius:16px;padding:12px;background:#fff;color:#172126;overflow:hidden}.visual svg{display:block;width:100%;height:auto;max-height:500px}.error{display:none;background:#ffd8d8;color:#781d1d;padding:12px;border-radius:10px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}.metric{padding:13px;border-radius:12px;background:var(--surface2)}.metric b{display:block;font:750 1.3rem ui-monospace,monospace;color:var(--accent)}.exploration-grid{dis </style></head><body><main id="app"></main><div class="notice" id="fixed-notice"></div>
<script>
'use strict';const SPEC={"plan":{"core_idea":"Explain discrete entropy with two meaningful controls and show intermediate contributions.","source_anchor":"selected source","prerequisites":[],"learning_outcomes":[{"outcome":"Explain discrete entropy with two meaningful controls and show intermediate contributions.","covered_by":["control:input","control:scale","view:0","exploration:1"]}],"key_insight_to_reveal":"How an input and scale change an illustrative output.","visual_idea":"A bar chart of the intermediate values.","controls_rationale":[{"id":"input","reveals":"Changes the illustrative input."},{"id":"scale","reveals":"Shows the effect of a display scale."}],"misconception":"This fallback is not a reconstruction of the paper.","simplifications":["A generic display transform is used because generation failed."],"figures":[]},"title":"Explain discrete entropy with two meaningful controls and show intermediate contributions.","citation":{"section":"","equation":"","figure_refs":[]},"intro":{"idea":"The requested mechanism could not be generated automatically.","why_it_matters":"The source and focus remain available for inspection.","key_equation":"illustrative output = input × scale"},"mechanism":{"kind":"conceptual_process","calculation_scope":"display_transform","source_anchor":"selected source","toy_model_notice":"Illustrative fallback only; it does not reproduce the paper's experiments."},"symbols":[{"symbol":"input","meaning":"Illustrative input, not a paper variable","source_anchor":"simplification"},{"symbol":"scale","meaning":"Illustrative display scale","source_anchor":"simplification"}],"controls":[{"id":"input","label":"Illustrative input","type":"slider","min":0,"max":10,"step":1,"default":2,"options":[],"rows":0,"cols":0,"help":"Fallback control","role":"paper_variable","paper_variable":"input"},{"id":"scale","label":"Display scale","type":"slider","min":0,"max":3,"step":0.25,"default":1,"options":[],"rows":0,"cols":0,"help":"Fallback display transform","role":"paper_variable","paper_variable":"scale"}],"compute":"function compute(p){const x=Number(p.input)||0,s=Number(p.scale)||0;return {values:{input:x,scale:s,output:x*s},series:{bars:[x,s,x*s]},matrices:{},notes:[]};}","views":[{"type":"bar","bind":"series.bars","title":"Fallback transform","x_label":"quantity","y_label":"value","caption":"Generic fallback values; not paper results."}],"custom_svg":"","intermediates":[{"key":"values.input","label":"Input","fmt":2},{"key":"values.output","label":"Output","fmt":2}],"explorations":[{"title":"Zero input","preset":{"input":0},"do":"Set input to zero.","observe":"The output becomes zero.","why":"The fallback uses multiplication.","expect":"r.values.output===0"},{"title":"Double scale","preset":{"input":2,"scale":2},"do":"Set both values to two.","observe":"The output becomes four.","why":"This is only a display transform.","expect":"r.values.output===4"}],"limitation":{"kind":"limitation","text":"Automatic generation failed, so this generic fallback does not explain the paper mechanism."},"claims":[{"text":"This is an unverified generic display example.","source":"simplification","anchor":""}],"tests":[{"name":"zero","inputs":{"input":0},"assert":"r.values.output===0"},{"name":"identity","inputs":{"input":3,"scale":1},"assert":"r.values.output===3"},{"name":"finite","inputs":{"input":10,"scale":3},"assert":"Number.isFinite(r.values.output)"}],"design":{"theme":"spectrum","typography":"editorial","accent":"","rationale":"","composition":[{"component":"hero","variant":"split"},{"component":"concept","variant":"equation_focus"},{"component":"playground","variant":"dashboard"},{"component":"explorations","variant":"cards"},{"component":"limitation","variant":"callout"},{"component":"evidence","variant":"ledger"}]}};const PAPER={"title":"Synthetic Entropy Teaching Note","authors":["Paper to Playground team"],"arxiv_id":"","version":"","dates":"","categories":"","journal_ref":"","license":"","urls":{"source":"https://example.org/synthetic-entropy-note"},"abstract":"","references":[],"figures":[],"mode":"supplied_excerpt"};const EXTRA={"figures":[],"notices":[]};const compute=(function compute(p){const x=Number(p.input)||0,s=Number(p.scale)||0;return {values:{input:x,scale:s,output:x*s},series:{bars:[x,s,x*s]},matrices:{},notes:[]};});const draw=(function draw(){return '<svg viewBox="0 0 600 320"></svg>'; });const $=s=>document.querySelector(s),node=(t,c)=>{const x=document.createElement(t);if(c)x.className=c;return x},txt=(t,v,c)=>{const x=node(t,c);x.textContent=v??'';return x},section=(name,variant)=>{const x=node('section','component '+name+' '+variant);x.dataset.component=name;return x};const state={},setters={};function clone(x){return JSON.parse(JSON.stringify(x))}function path(o,p){return String(p||'').split('.').reduce((a,k)=>a&&a[k],o)}function fmt(x,n=3){if(typeof x!=='number')return Array.isArray(x)?x.join(', '):String(x??'—');if(!Number.isFinite(x))return String(x);return Number(x.toFixed(n)).toString()}function titleBlock(kicker,title){const f=document.createDocumentFragment();f.append(txt('div',kicker,'eyebrow'),txt('h2',title));return f}
function hero(v){const s=section('hero',v),copy=node('div');copy.append(txt('div','Interactive paper explainer','eyebrow'),txt('h1',PAPER.title||SPEC.title),txt('p',SPEC.plan.core_idea||SPEC.intro.idea,'hero-copy'));const list=node('div','outcomes');(SPEC.plan.learning_outcomes||[]).forEach(o=>list.append(txt('div',o.outcome,'outcome')));s.append(copy,list);return s}
function sourceStrip(v){const s=section('source-strip',v);s.append(txt('span','Source grounding','badge'),txt('span',[PAPER.authors.join(', '),PAPER.arxiv_id,PAPER.version,PAPER.categories].filter(Boolean).join(' · '),'muted'));Object.entries(PAPER.urls||{}).forEach(([k,url])=>{if(!url)return;const a=txt('a',k.toUpperCase());a.href=url;a.rel='noopener noreferrer';s.append(a)});return s}
function concept(v){const s=section('concept surface',v),prose=node('div');prose.append(titleBlock('Starting point','The mechanism'),txt('p',SPEC.intro.idea),txt('h3','Why it matters'),txt('p',SPEC.intro.why_it_matters));const eq=node('div');eq.append(txt('div','Key relationship','eyebrow'),txt('code',SPEC.intro.key_equation,'equation'));s.append(prose,eq);return s}
function symbols(v){const s=section('symbols surface',v);s.append(titleBlock('Notation','Read the symbols'));if(v==='chips'){const grid=node('div','symbol-grid');SPEC.symbols.forEach(x=>{const c=node('article','symbol-chip');c.append(txt('b',x.symbol),txt('p',x.meaning),txt('small',x.source_anchor,'muted'));grid.append(c)});s.append(grid)}else{const table=node('table'),head=node('tr');['Symbol','Meaning','Source'].forEach(x=>head.append(txt('th',x)));table.append(head);SPEC.symbols.forEach(x=>{const tr=node('tr');[x.symbol,x.meaning,x.source_anchor].forEach(y=>tr.append(txt('td',y)));table.append(tr)});s.append(table)}return s}
function paperFigure(v){if(!EXTRA.figures.length)return null;const s=section('paper-figure surface',v),grid=node('div','figure-grid');s.append(titleBlock('From the paper','Figure as evidence'));EXTRA.figures.forEach(f=>{const fig=node('figure','figure-card');if(f.data){const img=node('img');img.src=f.data;img.alt=f.caption;fig.append(img)}fig.append(txt('figcaption','📄 Figure '+f.number+': '+f.caption+' — '+f.role));grid.append(fig)});s.append(grid);return s}
function playground(v){const s=section('lab surface',v);s.append(titleBlock('Executable explanation','Try the mechanism'),txt('p',SPEC.mechanism.toy_model_notice,'muted'));const error=node('div','error');error.id='runtime-error';s.append(error);const grid=node('div','lab-grid'),controls=node('aside','controls'),right=node('div'),visual=node('div','visual');controls.id='controls';visual.id='visual';visual.setAttribute('role','img');const caption=txt('p','', 'muted');caption.id='view-caption';const metrics=node('div','metrics');metrics.id='intermediates';right.append(visual,caption,metrics);grid.append(controls,right);s.append(grid);return s}
function explorations(v){const s=section('explorations surface',v),grid=node('div','exploration-grid '+v);grid.id='explorations';s.append(titleBlock('Guided inquiry','Two things to try'),grid);return s}
function limitation(v){const s=section('limitation surface',v);s.append(titleBlock(SPEC.limitation.kind||'Reality check','Where the model stops'),txt('p',SPEC.limitation.text));return s}
function evidence(v){const s=section('evidence surface',v),claims=node('div');claims.id='claims';s.append(titleBlock('Grounding ledger','Sources & simplifications'),claims);SPEC.claims.forEach(c=>{const row=node('div','claim'),b=txt('span',c.source==='paper'?'📄 Paper':c.source==='brief'?'📝 Brief':'🧪 Simplification','badge');row.append(b,txt('span',c.text));claims.append(row)});const refs=node('ol');refs.id='references';PAPER.references.forEach(r=>refs.append(txt('li',r.text)));if(PAPER.references.length){s.append(txt('h3','References cited'),refs)}return s}
function appendix(v){const s=section('appendix surface',v);s.append(titleBlock('Deep cuts','Paper appendix'));const details=(label,content)=>{const d=node('details');d.append(txt('summary',label),content);return d};s.append(details('Abstract',txt('p',PAPER.abstract||'Not available.')));const figs=node('div');PAPER.figures.forEach(f=>figs.append(txt('p','Figure '+f.number+': '+f.caption)));s.append(details('All figures',figs));const bib=node('ol');PAPER.references.forEach(r=>bib.append(txt('li',r.text)));s.append(details('Full bibliography',bib));return s}
const COMPONENTS={hero,source_strip:sourceStrip,concept,symbols,paper_figure:paperFigure,playground,explorations,limitation,evidence,appendix};function build(){const d=SPEC.design||{};document.body.dataset.theme=d.theme||'parchment';document.body.dataset.type=d.typography||'editorial';if(d.accent)document.documentElement.style.setProperty('--accent',d.accent);const app=$('#app');(d.composition||[]).forEach(item=>{const maker=COMPONENTS[item.component];if(maker){const made=maker(item.variant);if(made)app.append(made)}});$('#fixed-notice').textContent='Illustrative toy model; it does not reproduce the paper’s experimental results.'+(PAPER.mode==='brief_only'?' Source text was unavailable; statements are not verified against the paper.':'')}
function initControls(){SPEC.controls.forEach(c=>{state[c.id]=clone(c.default);const box=node('div','control-row'),label=txt('label',c.label);label.htmlFor='c-'+c.id;box.append(label);let input;if(c.type==='select'){input=node('select');(c.options||[]).forEach(o=>{const op=txt('option',typeof o==='object'?o.label:o);op.value=typeof o==='object'?o.value:o;input.append(op)});input.value=c.default}else if(c.type==='toggle'){input=node('input');input.type='checkbox';input.checked=!!c.default}else if(c.type==='matrix'){input=node('textarea');input.rows=Math.max(2,c.rows||2);input.value=JSON.stringify(c.default)}else{input=node('input');input.type=c.type==='slider'?'range':'number';['min','max','step'].forEach(k=>{if(c[k]!==undefined)input[k]=c[k]});input.value=c.default;const out=txt('span',' ','value');out.id='v-'+c.id;box.append(out)}input.id='c-'+c.id;const read=()=>{if(c.type==='toggle')return input.checked;if(c.type==='matrix'){try{return JSON.parse(input.value)}catch(e){return state[c.id]}}if(c.type==='select')return input.value;return Number(input.value)};setters[c.id]=v=>{if(c.type==='toggle')input.checked=!!v;else input.value=c.type==='matrix'?JSON.stringify(v):v;state[c.id]=read()};input.addEventListener('input',()=>{state[c.id]=read();update()});box.append(input,txt('div',c.help||'','help'));$('#controls').append(box)})}
function chart(value,view){const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 640 340');const vals=Array.isArray(value)?value:(value&&typeof value==='object'?Object.values(value):[value]),nums=vals.flat().filter(x=>typeof x==='number'&&Number.isFinite(x)),max=Math.max(1,...nums.map(Math.abs));if(view.type==='heatmap'&&Array.isArray(value)){const rows=value.length,cols=Math.max(1,...value.map(r=>r.length));value.forEach((row,i)=>row.forEach((n,j)=>{const rect=document.createElementNS(ns,'rect');rect.setAttribute('x',80+j*480/cols);rect.setAttribute('y',30+i*260/rows);rect.setAttribute('width',470/cols);rect.setAttribute('height',250/rows);rect.setAttribute('fill',`hsl(190 60% ${90-55*Math.abs(n)/max}%)`);const t=document.createElementNS(ns,'text');t.setAttribute('x',90+j*480/cols);t.setAttribute('y',55+i*260/rows);t.textContent=fmt(n,2);svg.append(rect,t)}))}else nums.forEach((n,i)=>{const w=500/Math.max(1,nums.length),h=240*Math.abs(n)/max,r=document.createElementNS(ns,'rect');r.setAttribute('x',70+i*w);r.setAttribute('y',285-h);r.setAttribute('width',Math.max(8,w-8));r.setAttribute('height',h);r.setAttribute('fill','#0a9396');const t=document.createElementNS(ns,'text');t.setAttribute('x',72+i*w);t.setAttribute('y',310);t.textContent=fmt(n,2);svg.append(r,t)});return svg}
function update(){try{const r=compute(clone(state)),err=$('#runtime-error');err.style.display='none';SPEC.controls.forEach(c=>{const out=$('#v-'+c.id);if(out)out.textContent=' '+fmt(state[c.id])});const host=$('#visual');host.replaceChildren();const custom=SPEC.views.find(v=>v.type==='custom');if(custom&&SPEC.custom_svg){host.innerHTML=draw(clone(state),clone(r));$('#view-caption').textContent=custom.caption||''}else{const view=SPEC.views[0]||{type:'bar',bind:'values'};host.append(chart(path(r,view.bind),view));$('#view-caption').textContent=view.caption||''}host.setAttribute('aria-label',(SPEC.views[0]||{}).caption||'Interactive visual');const metrics=$('#intermediates');metrics.replaceChildren();SPEC.intermediates.forEach(m=>{const d=node('div','metric');d.append(txt('b',fmt(path(r,m.key),m.fmt??3)),document.createTextNode(m.label));metrics.append(d)});window.lastResult=r}catch(e){const err=$('#runtime-error');err.textContent='The illustrative calculation could not update: '+e.message;err.style.display='block'}}
function initExplorations(){SPEC.explorations.forEach((x,i)=>{const box=node('article','explore surface'),h=txt('h3',x.title||'Exploration '+(i+1)),p=txt('p',x.do+' Observe: '+x.observe+' Why: '+x.why),b=txt('button','Try it');b.addEventListener('click',()=>{Object.entries(x.preset||{}).forEach(([k,v])=>setters[k]&&setters[k](v));update();$('#visual').classList.add('flash');setTimeout(()=>$('#visual').classList.remove('flash'),1200);$('#visual').scrollIntoView({behavior:'smooth',block:'center'})});box.append(h,p,b);$('#explorations').append(box)})}
build();initControls();initExplorations();update();
</script></body></html>
